<VirtualHost *:443>
    ServerName www.fireanddine.co.za
    DocumentRoot /srv/fireanddine/current/public

    <Directory /srv/fireanddine/current/public>
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost/"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/fireanddine-error.log
    CustomLog ${APACHE_LOG_DIR}/fireanddine-access.log combined
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/www.fireanddine.co.za/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/www.fireanddine.co.za/privkey.pem
</VirtualHost>
