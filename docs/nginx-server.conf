server {
    listen 443 ssl http2;
    server_name www.fireanddine.co.za;
    root /srv/fireanddine/current/public;
    index index.php;

    ssl_certificate /etc/letsencrypt/live/www.fireanddine.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.fireanddine.co.za/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    location = /api/brochure.php { return 301 /api/brochure$is_args$args; }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ~ /\. { deny all; }
    location ~* ^/(?:database|storage|config|src|vendor|tests|bin)(?:/|$) { deny all; }
    location ~* ^/uploads/.*\.(?:php|phtml|phar|cgi|pl|py|sh|sql|env|ini|log)$ { deny all; }
    location ~* ^/uploads/.*\.(?:pdf|csv|txt|json|xml|zip|conf|bak)$ { deny all; }
}
